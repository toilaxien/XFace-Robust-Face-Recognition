[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xface-robust-face-recognition"
version = "0.1.0"
description = "Quality-adaptive and reliability-aware learning for robust face recognition."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Binh Xuyen Ngo"},
  {name = "Thi Vinh Thanh Le"}
]
dependencies = [
  "numpy",
  "pandas",
  "Pillow",
  "PyYAML",
  "scikit-learn",
  "scipy",
  "torch",
  "torchvision",
  "timm",
  "tqdm"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
